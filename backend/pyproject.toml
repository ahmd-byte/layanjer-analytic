[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layan-engine"
version = "0.1.0"
description = "AI-powered social media analytics extraction engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "playwright>=1.49,<2",
    "pandas>=2.2,<3",
    "tenacity>=9.0,<10",
    "apscheduler>=3.10,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "structlog>=24.0,<25",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
ai = [
    "openai>=1.60,<2",
    "browser-use>=0.2,<1",
]
sheets = [
    "gspread>=6.0,<7",
    "google-auth>=2.0,<3",
    "google-auth-oauthlib>=1.0,<2",
]
ocr = [
    "paddleocr>=2.9,<3",
    "paddlepaddle>=2.6,<3",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "httpx>=0.28,<1",
]

[project.scripts]
layan = "layan_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/layan_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
